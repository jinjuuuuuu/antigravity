<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 BMI 체질량지수 계산기</title>
  <meta name="description" content="키와 몸무게를 입력하여 쉽게 체질량지수(BMI)를 계산하고 비만도를 측정하는 스마트 웹 앱입니다." />
  <!-- Google Fonts 가져오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      
      --underweight: #3b82f6;
      --normal: #10b981;
      --overweight: #f59e0b;
      --obese: #ef4444;
      --severely-obese: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .unit-badge {
      font-size: 12px;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="number"]:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    /* 결과 카드 */
    .result-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .bmi-value-display {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      margin: 12px 0 8px 0;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .bmi-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    /* 비만도 바 & 게이지 */
    .meter-container {
      position: relative;
      margin-top: 16px;
      padding: 0 4px;
    }

    .meter-bar {
      height: 10px;
      width: 100%;
      border-radius: 5px;
      background: linear-gradient(to right, 
        var(--underweight) 0%, 
        var(--normal) 30%, 
        var(--overweight) 55%, 
        var(--obese) 75%, 
        var(--severely-obese) 100%
      );
      position: relative;
    }

    .meter-indicator {
      position: absolute;
      top: -6px;
      left: 0%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: #ffffff;
      border: 3px solid #6366f1;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 권장 체중 가이드 */
    .health-info {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      line-height: 1.5;
    }

    /* 기록 버튼 */
    .btn-save {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent-color) 0%, #8b5cf6 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: all 0.25s ease;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-save:active {
      transform: translateY(0);
    }

    /* 측정 기록 목록 */
    .history-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .history-date {
      color: var(--text-muted);
      font-size: 11px;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📊 스마트 BMI 계산기</h1>
      <p>키와 몸무게를 입력하여 체질량지수를 정밀하게 계산해 드립니다.</p>
    </div>

    <div class="input-section">
      <!-- 키 입력 -->
      <div class="input-group">
        <div class="input-label-row">
          <label for="height">신장 (키)</label>
          <span class="unit-badge">cm</span>
        </div>
        <div class="input-wrapper">
          <input type="number" id="height" placeholder="예: 175" value="175" oninput="calculateBMI()" />
        </div>
      </div>

      <!-- 몸무게 입력 -->
      <div class="input-group">
        <div class="input-label-row">
          <label for="weight">체중 (몸무게)</label>
          <span class="unit-badge">kg</span>
        </div>
        <div class="input-wrapper">
          <input type="number" id="weight" placeholder="예: 70" value="70" oninput="calculateBMI()" />
        </div>
      </div>
    </div>

    <!-- 결과 영역 -->
    <div class="result-card">
      <div style="font-size: 13px; color: var(--text-muted);">계산된 체질량지수 (BMI)</div>
      <div class="bmi-value-display" id="bmiValue">22.86</div>
      <div class="bmi-badge" id="bmiBadge" style="background: rgba(16, 185, 129, 0.2); color: var(--normal);">
        정상 체중
      </div>

      <!-- 비만도 게이지 바 -->
      <div class="meter-container">
        <div class="meter-bar">
          <div class="meter-indicator" id="meterIndicator"></div>
        </div>
        <div class="meter-labels">
          <span>18.5 (저체중)</span>
          <span>23.0 (정상)</span>
          <span>25.0 (과체중)</span>
          <span>30.0 (비만)</span>
        </div>
      </div>

      <div class="health-info" id="healthInfo">
        💡 신장 175cm 기준 표준 체중 범위는 <strong>56.7kg ~ 70.1kg</strong> 입니다.
      </div>
    </div>

    <!-- 기록 저장 버튼 -->
    <button class="btn-save" onclick="saveRecord()">📌 측정 결과 기록하기</button>

    <!-- 측정 기록 -->
    <div class="history-section">
      <div class="history-header">
        <h3>📋 최근 측정 기록</h3>
        <button class="btn-clear" onclick="clearHistory()">기록 삭제</button>
      </div>
      <ul class="history-list" id="historyList">
        <!-- JS로 동적 추가됨 -->
      </ul>
    </div>
  </div>

  <footer>
    © 2026 Smart BMI Calculator • Vercel Ready
  </footer>

  <script>
    let currentBmi = 22.86;
    let currentCategory = "정상";

    function calculateBMI() {
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);

      const bmiValueEl = document.getElementById('bmiValue');
      const bmiBadgeEl = document.getElementById('bmiBadge');
      const meterIndicatorEl = document.getElementById('meterIndicator');
      const healthInfoEl = document.getElementById('healthInfo');

      if (!height || !weight || height <= 0 || weight <= 0) {
        bmiValueEl.innerText = "--";
        bmiBadgeEl.innerText = "입력 필요";
        bmiBadgeEl.style.background = "rgba(255, 255, 255, 0.1)";
        bmiBadgeEl.style.color = "#ffffff";
        meterIndicatorEl.style.left = "0%";
        healthInfoEl.innerHTML = "키와 몸무게를 정확히 입력해 주세요.";
        return;
      }

      // BMI 계산: 몸무게(kg) / (키(m)^2)
      const heightM = height / 100;
      const bmi = weight / (heightM * heightM);
      currentBmi = Math.round(bmi * 100) / 100;

      bmiValueEl.innerText = currentBmi.toFixed(2);

      // 판정 기준 (대한비만학회)
      let category = "";
      let color = "";
      let bgColor = "";
      let indicatorPos = 0; // %

      if (currentBmi < 18.5) {
        category = "저체중";
        color = "var(--underweight)";
        bgColor = "rgba(59, 130, 246, 0.2)";
        indicatorPos = Math.min(Math.max((currentBmi / 18.5) * 20, 5), 20);
      } else if (currentBmi < 23.0) {
        category = "정상 체중";
        color = "var(--normal)";
        bgColor = "rgba(16, 185, 129, 0.2)";
        indicatorPos = 20 + ((currentBmi - 18.5) / (23.0 - 18.5)) * 30;
      } else if (currentBmi < 25.0) {
        category = "과체중 (비만 전단계)";
        color = "var(--overweight)";
        bgColor = "rgba(245, 158, 11, 0.2)";
        indicatorPos = 50 + ((currentBmi - 23.0) / (25.0 - 23.0)) * 20;
      } else if (currentBmi < 30.0) {
        category = "1단계 비만";
        color = "var(--obese)";
        bgColor = "rgba(239, 68, 68, 0.2)";
        indicatorPos = 70 + ((currentBmi - 25.0) / (30.0 - 25.0)) * 18;
      } else {
        category = "2단계 이상 고도비만";
        color = "var(--severely-obese)";
        bgColor = "rgba(168, 85, 247, 0.2)";
        indicatorPos = Math.min(88 + ((currentBmi - 30.0) / 10) * 12, 98);
      }

      currentCategory = category;

      bmiBadgeEl.innerText = category;
      bmiBadgeEl.style.color = color;
      bmiBadgeEl.style.background = bgColor;

      meterIndicatorEl.style.left = `${indicatorPos}%`;
      meterIndicatorEl.style.borderColor = color;

      // 표준 체중 구하기 (BMI 18.5 ~ 22.9)
      const minHealthyWeight = Math.round(18.5 * heightM * heightM * 10) / 10;
      const maxHealthyWeight = Math.round(22.9 * heightM * heightM * 10) / 10;

      healthInfoEl.innerHTML = `💡 신장 <strong>${height}cm</strong> 기준 권장 정상 체중은 <strong>${minHealthyWeight}kg ~ ${maxHealthyWeight}kg</strong> 입니다.`;
    }

    // localStorage에 측정 기록 저장
    function saveRecord() {
      const height = document.getElementById('height').value;
      const weight = document.getElementById('weight').value;
      if (!height || !weight) return;

      const dateStr = new Date().toLocaleDateString('ko-KR', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      const record = {
        date: dateStr,
        height,
        weight,
        bmi: currentBmi,
        category: currentCategory
      };

      const history = JSON.parse(localStorage.getItem('bmiHistory') || '[]');
      history.unshift(record); // 최신순 추가
      if (history.length > 10) history.pop(); // 최대 10개 유지

      localStorage.setItem('bmiHistory', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const historyListEl = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('bmiHistory') || '[]');

      if (history.length === 0) {
        historyListEl.innerHTML = '<li style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">저장된 기록이 없습니다.</li>';
        return;
      }

      historyListEl.innerHTML = history.map(item => `
        <li class="history-item">
          <div>
            <strong>${item.bmi}</strong> <span style="color: var(--text-muted); font-size: 11px;">(${item.category})</span>
            <div class="history-date">${item.height}cm / ${item.weight}kg</div>
          </div>
          <div class="history-date">${item.date}</div>
        </li>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('bmiHistory');
      renderHistory();
    }

    // 초기 실행
    calculateBMI();
    renderHistory();
  </script>
</body>
</html>
